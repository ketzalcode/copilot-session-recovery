name: Bug report
description: Report a reproducible Copilot Session Recovery problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include prompts, responses, tokens, credentials, private source, or exploit details.
        Review local paths before sharing diagnostic output.
  - type: input
    id: tool-version
    attributes:
      label: Copilot Session Recovery version
      description: Run `copilot-session-recovery --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: copilot-version
    attributes:
      label: Copilot CLI version
      description: Run your Copilot CLI version command and paste the version only.
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: Include the exact supported OS and version.
      placeholder: "Windows 11 24H2 or macOS 15.x"
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: "x64 or arm64"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`.
      placeholder: "v24.21.0"
    validations:
      required: true
  - type: input
    id: npm-version
    attributes:
      label: npm version
      description: Run `npm --version`.
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal used for recovery
      options:
        - Windows Terminal
        - Apple Terminal
    validations:
      required: true
  - type: dropdown
    id: launcher-profile
    attributes:
      label: Launcher profile
      options:
        - copilot
        - agency
        - custom
    validations:
      required: true
  - type: textarea
    id: doctor-output
    attributes:
      label: "`copilot-session-recovery doctor` output"
      description: Review paths for sensitivity before pasting. Do not include hook payloads, prompts, responses, source content, credentials, or tokens.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide exact commands and what happened.
      placeholder: |
        1. Run ...
        2. Start a Copilot session in ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
