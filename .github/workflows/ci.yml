name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Commit metadata guard self-test
        run: node test/commit-metadata-guard-self-test.mjs
      - name: Reject non-noreply maintainer commit metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/check-commit-metadata.mjs --base "$env:BASE_SHA" --head "$env:HEAD_SHA"
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: copilot-session-recovery-windows-x64
          path: |
            dist/copilot-session-recovery-windows-x64.exe
            dist/copilot-session-recovery-windows-x64.exe.sha256
