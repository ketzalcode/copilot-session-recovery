name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: anchore/sbom-action@v0.24.3
        with:
          path: dist/copilot-session-recovery-windows-x64.exe
          output-file: dist/copilot-session-recovery-windows-x64.spdx.json
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/copilot-session-recovery-windows-x64.exe
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/copilot-session-recovery-windows-x64.exe
            dist/copilot-session-recovery-windows-x64.exe.sha256
            dist/copilot-session-recovery-windows-x64.spdx.json
